name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.22.3', '26.13.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check-browser-secrets.mjs
      - name: Check the compiled HTTP service
        shell: bash
        env:
          NODE_ENV: test
          OPENAI_API_KEY: startup-fixture
          QDRANT_URL: http://qdrant.invalid
          PORT: 17070
        run: |
          node backend/dist/index.js &
          pid=$!
          trap 'kill "$pid"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:17070/health | jq -e '.status == "ok"'
